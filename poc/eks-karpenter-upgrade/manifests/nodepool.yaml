# NodePool: the rollout engine with brakes.
#
# The budgets below encode the full operational policy from the article,
# including the three details that bite people in production:
#
# 1. Schedules run in UTC (the field has no timezone support).
#    "0 11 * * mon-fri" == 08:00 America/Fortaleza (UTC-3). Adjust for your
#    local business window and leave this comment updated.
#
# 2. Defining ANY budget removes the implicit 10% default for reasons you
#    do not mention. Scope everything to Drifted only and Underutilized and
#    Empty are left with NO limit at all. That is why consolidation gets its
#    own explicit line below.
#
# 3. Percentages round UP: a 3-node pool with "10%" still allows 1 node in
#    disruption (effectively 33%). If an absolute ceiling matters on small
#    pools, add a numeric budget; the lower of the two wins.
#
# expireAfter and terminationGracePeriod work as a pair:
# expireAfter caps how old a node may get, terminationGracePeriod caps how
# long its exit may take, and their sum is the approximate worst-case node
# lifetime. Remember: expiration is a FORCEFUL disruption. It is NOT paced
# by the budgets below and does not guarantee replacement capacity is up
# before the drain starts. The grace period also applies to drift drains:
# PDBs hold until the deadline, not past it.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      expireAfter: 720h            # hard ceiling on node age (also the current default)
      terminationGracePeriod: 1h   # hard deadline on any drain, drift included
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    budgets:
      # Upgrade rotation: at most ~10% of nodes at a time (rounded up).
      - nodes: "10%"
        reasons:
          - Drifted
      # Consolidation keeps its own explicit limit (see comment 2 above).
      - nodes: "10%"
        reasons:
          - Underutilized
          - Empty
      # Freeze drift rotation during the local business window.
      # 11:00 UTC == 08:00 America/Fortaleza. Scoped to Drifted so
      # consolidation keeps optimizing cost during the freeze.
      - nodes: "0"
        schedule: "0 11 * * mon-fri"
        duration: 10h
        reasons:
          - Drifted
